[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birddeck"
version = "0.1.0"
description = "Build an Anki field guide to the birds around a place."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["requests>=2.32,<3", "genanki>=0.13,<0.14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
birddeck = "birddeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
